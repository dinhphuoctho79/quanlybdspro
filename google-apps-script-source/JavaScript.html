let CURRENT_USER = null;

function resetUserInterfaceToGuest() {
  const avatarEl = document.getElementById('user-avatar');
  if (avatarEl) {
    avatarEl.innerText = '?';
    avatarEl.className = 'w-7 h-7 rounded-full bg-slate-500 text-white font-extrabold flex items-center justify-center text-xs shadow-xs border border-white';
  }
  const nameEl = document.getElementById('user-display-name');
  if (nameEl) nameEl.innerText = 'Chưa đăng nhập';
  const badgeEl = document.getElementById('user-role-badge');

    badgeEl.innerText = 'Khách';
    badgeEl.className = 'text-[9px] font-bold bg-slate-100 text-slate-600 px-1.5 py-0.2 rounded-full inline-block mt-0.5';
  }

  }
  const menuName = document.getElementById('menu-user-fullname');
  if (menuName) menuName.innerText = 'Chưa đăng nhập';
  const menuTitle = document.getElementById('menu-user-title');
  if (menuTitle) menuTitle.innerText = 'Vui lòng đăng nhập để thao tác';
}


function toggleUserDropdown() {
  const menu = document.getElementById('user-dropdown-menu');
  if (menu) {
    menu.classList.toggle('hidden');
  }
}

function closeUserDropdown() {
  const menu = document.getElementById('user-dropdown-menu');
  if (menu) {
    menu.classList.add('hidden');
  }
}

function switchUserRole(roleKey) {
  closeUserDropdown();
  const acc = USER_ACCOUNTS[roleKey];
  if (acc) {
    CURRENT_USER = acc;
    try {
      sessionStorage.setItem('bds_user_account', acc.role);
      sessionStorage.removeItem('bds_logged_out');
    } catch(e){}
    unlockAppFromLogin();
    applyUserPermissions(acc);
    showToast(`Đã chuyển sang vai trò: ${acc.title} (${acc.fullName})`, 'success');
  }
}

function initAuthSession() {
  try {
    const isLoggedOut = sessionStorage.getItem('bds_logged_out');
    const saved = sessionStorage.getItem('bds_user_account');
    
    // Nếu đã đăng nhập trước đó trong phiên làm việc này
    if (isLoggedOut !== '1' && saved && USER_ACCOUNTS[saved]) {
      CURRENT_USER = USER_ACCOUNTS[saved];
      applyUserPermissions(CURRENT_USER);
      const appLayout = document.querySelector('body > div');
      if (appLayout) {
        appLayout.classList.remove('pointer-events-none', 'filter', 'blur-sm', 'select-none');
      }
      return;
    }
  } catch(e) {}

  // MẶC ĐỊNH KHI MỚI VÀO WEB APP: BẮT BUỘC HIỂN THỊ MÀN HÌNH ĐĂNG NHẬP!
  CURRENT_USER = null;
  resetUserInterfaceToGuest();
  openLoginModal(true);
}

function applyUserPermissions(user) {
  if (!user) {
    resetUserInterfaceToGuest();
    return;
  }
  CURRENT_USER = user;
  const perm = ROLE_PERMISSIONS[user.role] || ROLE_PERMISSIONS.admin;

  // Cập nhật Header
  const avatarEl = document.getElementById('user-avatar');
  if (avatarEl) {
    avatarEl.innerText = user.avatarInitials;
    avatarEl.className = `w-7 h-7 rounded-full ${perm.avatarBg} text-white font-extrabold flex items-center justify-center text-xs shadow-xs border border-white`;
  }
  const nameEl = document.getElementById('user-display-name');
  if (nameEl) nameEl.innerText = user.fullName;
  const badgeEl = document.getElementById('user-role-badge');
  if (badgeEl) {
    badgeEl.innerText = perm.name;
    badgeEl.className = `text-[9px] font-bold ${perm.badgeClass} px-1.5 py-0.2 rounded-full inline-block mt-0.5`;
  }

  // Cập nhật Menu dropdown
  const menuAvatar = document.getElementById('menu-avatar-large');
  if (menuAvatar) {
    menuAvatar.innerText = user.avatarInitials;
    menuAvatar.className = `w-9 h-9 rounded-full ${perm.avatarBg} text-white font-extrabold flex items-center justify-center text-sm shadow-md`;
  }
  const menuName = document.getElementById('menu-user-fullname');
  if (menuName) menuName.innerText = user.fullName;
  const menuTitle = document.getElementById('menu-user-title');
  if (menuTitle) menuTitle.innerText = user.title;
  const menuDept = document.getElementById('menu-user-dept');
  if (menuDept) menuDept.innerText = user.department;
  const menuRoleBadge = document.getElementById('menu-user-role-badge');
  if (menuRoleBadge) {
    menuRoleBadge.innerText = perm.name;
    menuRoleBadge.className = `text-[10px] font-bold ${perm.badgeClass} px-2 py-0.5 rounded-full inline-block`;
  }

  // Cập nhật nút quản trị
  const adminMenuSection = document.getElementById('menu-admin-section');
  if (adminMenuSection) {
    adminMenuSection.style.display = perm.canManageUsers ? 'block' : 'none';
  }

  // Cập nhật giao diện theo quyền
  applyPermissionRestrictions(perm);
}

function applyPermissionRestrictions(perm) {
  if (!perm) return;
  const canEdit = perm.canEdit !== false;
  const canDelete = perm.canDelete === true;

  // Ẩn/hiện nút xóa
  document.querySelectorAll('.btn-action-delete').forEach(btn => {
    btn.style.display = canDelete ? '' : 'none';
  });
  // Ẩn/hiện nút sửa
  document.querySelectorAll('.btn-action-edit').forEach(btn => {
    btn.style.display = canEdit ? '' : 'none';
  });
  // Ẩn/hiện nút thêm mới dữ liệu (Dự Án, Khách Hàng, Lô Đất, Giao Dịch...)
  document.querySelectorAll('button[onclick*="openAddModal"]').forEach(btn => {
    btn.style.display = canEdit ? '' : 'none';
  });
  // Ẩn/hiện nút cấp quyền nhân viên
  const btnRbac = document.querySelector('button[onclick*="openEmployeeRbacModal()"]');
  if (btnRbac) {
    btnRbac.style.display = perm.canManageUsers ? '' : 'none';
  }
}



function lockAppForLogin() {
  const sidebar = document.getElementById('app-sidebar');
  const main = document.querySelector('main');
  if (sidebar) sidebar.classList.add('pointer-events-none', 'filter', 'blur-sm', 'select-none');
  if (main) main.classList.add('pointer-events-none', 'filter', 'blur-sm', 'select-none');
}


function showToast(msg, type = 'success') {
  let toast = document.getElementById('app-toast-popup');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'app-toast-popup';
    toast.className = 'fixed top-5 right-5 z-[999999] px-4 py-3 rounded-xl shadow-2xl flex items-center gap-2.5 text-xs font-bold transition-all duration-300 transform translate-y-[-20px] opacity-0 pointer-events-none';
    document.body.appendChild(toast);
  }
  
  const isErr = type === 'error';
  toast.className = `fixed top-5 right-5 z-[999999] px-4 py-3 rounded-xl shadow-2xl flex items-center gap-2.5 text-xs font-bold transition-all duration-300 transform translate-y-0 opacity-100 ${isErr ? 'bg-red-600 text-white' : 'bg-emerald-700 text-white'}`;
  toast.innerHTML = `<i class="fa ${isErr ? 'fa-circle-exclamation' : 'fa-circle-check'} text-base"></i> <span>${msg}</span>`;
  
  setTimeout(() => {
    toast.className = toast.className.replace('translate-y-0 opacity-100', 'translate-y-[-20px] opacity-0 pointer-events-none');
  }, 3500);
}

function unlockAppFromLogin() {
  const sidebar = document.getElementById('app-sidebar');
  const main = document.querySelector('main');
  if (sidebar) sidebar.classList.remove('pointer-events-none', 'filter', 'blur-sm', 'select-none');
  if (main) main.classList.remove('pointer-events-none', 'filter', 'blur-sm', 'select-none');
}

function openLoginModal(isForced) {
  closeUserDropdown();
  const modal = document.getElementById('login-modal');
  const btnClose = document.getElementById('btn-close-login-modal');

  if (isForced || !CURRENT_USER) {
    if (btnClose) btnClose.style.display = 'none';
    lockAppForLogin();
  } else {
    if (btnClose) btnClose.style.display = 'block';
  }

  if (modal) {
    modal.classList.remove('hidden');
    modal.style.display = 'flex';
  }
}

function closeLoginModal() {
  if (!CURRENT_USER) {
    alert("⚠️ Bạn chưa đăng nhập! Vui lòng chọn một tài khoản để truy cập hệ thống.");
    return;
  }
  const modal = document.getElementById('login-modal');
  
  if (modal) {
    modal.classList.add('hidden');
    modal.style.display = 'none';
  }
}

function quickFillLogin(username, password) {
  const uInput = document.getElementById('login-input-username');
  if (uInput) uInput.value = username;
  const pInput = document.getElementById('login-input-password');
  if (pInput) pInput.value = password;
  submitUserLogin();
}

function submitUserLogin() {
  const uInput = document.getElementById('login-input-username');
  const pInput = document.getElementById('login-input-password');
  const u = (uInput?.value || '').trim().toLowerCase();
  const p = (pInput?.value || '').trim();

  const found = Object.values(USER_ACCOUNTS).find(acc => acc.username.toLowerCase() === u);
  if (!found) {
    showToast("Tên đăng nhập không đúng! Thử: admin, truongphong, sale, ketoan", "error");
    if (uInput) uInput.focus();
    return;
  }

  if (found.password !== p) {
    showToast("Mật khẩu không đúng! Mật khẩu mẫu mặc định là: 123456", "error");
    if (pInput) { pInput.value = ''; pInput.focus(); }
    return;
  }

  try { 
    sessionStorage.setItem('bds_user_account', found.role);
    sessionStorage.removeItem('bds_logged_out');
  } catch(e){}

  CURRENT_USER = found;

  const btnClose = document.getElementById('btn-close-login-modal');
  if (btnClose) btnClose.style.display = 'block';

  unlockAppFromLogin();
  applyUserPermissions(found);
  
  const modal = document.getElementById('login-modal');
  if (modal) { 
    modal.classList.add('hidden'); 
    modal.style.display = 'none'; 
  }

  showToast(`Đăng nhập thành công! Chào mừng ${found.fullName} (${found.title})`, 'success');
}

function logoutUser() {
  closeUserDropdown();
  CURRENT_USER = null;
  try { 
    sessionStorage.removeItem('bds_user_account');
    sessionStorage.setItem('bds_logged_out', '1');
  } catch(e){}
  resetUserInterfaceToGuest();
  lockAppForLogin();
  openLoginModal(true);
  showToast("Đã đăng xuất khỏi hệ thống!", "success");
}

function handleLogoFileUpload(event) {
  const file = event.target.files[0];
  if (!file) return;

  if (!file.type.startsWith('image/')) {
    alert("Vui lòng chọn file hình ảnh (PNG, JPG, WebP, SVG)!");
    return;
  }

  if (file.size > 2 * 1024 * 1024) {
    alert("Kích thước file logo nên nhỏ hơn 2MB để hệ thống hoạt động mượt mà nhất!");
  }

  const reader = new FileReader();
  reader.onload = function(e) {
    const dataUrl = e.target.result;
    applyCompanyLogo(dataUrl);
    const input = document.getElementById('cfg-COMPANY_LOGO');
    if (input) input.value = dataUrl;
    alert("✅ Đã tải logo công ty lên thành công! Bấm 'Lưu Toàn Bộ Cấu Hình' để lưu vĩnh viễn.");
  };
  reader.readAsDataURL(file);
}

function updateLogoFromUrl(url) {
  applyCompanyLogo(url.trim());
}

function useDefaultDinhCongLogo() {
  const defaultUrl = 'https://luong-viet-360.vercel.app/logo-dinhcong.webp';
  applyCompanyLogo(defaultUrl);
  const input = document.getElementById('cfg-COMPANY_LOGO');
  if (input) input.value = defaultUrl;
  alert("✅ Đã khôi phục Logo mẫu DinhCông Digital!");
}

function removeCompanyLogo() {
  applyCompanyLogo('');
  const input = document.getElementById('cfg-COMPANY_LOGO');
  if (input) input.value = '';
}

function applyCompanyLogo(logoUrl) {
  const sidebarImg = document.getElementById('app-company-logo');
  const sidebarIcon = document.getElementById('app-company-logo-icon');
  const previewImg = document.getElementById('cfg-logo-preview');
  const previewPlaceholder = document.getElementById('cfg-logo-placeholder');
  const loginImg = document.getElementById('login-logo-img');

  if (logoUrl) {
    if (sidebarImg) { sidebarImg.src = logoUrl; sidebarImg.classList.remove('hidden'); }
    if (sidebarIcon) sidebarIcon.classList.add('hidden');
    if (previewImg) { previewImg.src = logoUrl; previewImg.classList.remove('hidden'); }
    if (previewPlaceholder) previewPlaceholder.classList.add('hidden');
    if (loginImg) loginImg.src = logoUrl;
  } else {
    if (sidebarImg) sidebarImg.classList.add('hidden');
    if (sidebarIcon) sidebarIcon.classList.remove('hidden');
    if (previewImg) previewImg.classList.add('hidden');
    if (previewPlaceholder) previewPlaceholder.classList.remove('hidden');
  }
}

function handleLogoLoadError() {
  const sidebarImg = document.getElementById('app-company-logo');
  const sidebarIcon = document.getElementById('app-company-logo-icon');
  if (sidebarImg) sidebarImg.classList.add('hidden');
  if (sidebarIcon) sidebarIcon.classList.remove('hidden');
}

function handlePreviewLogoError() {
  const previewImg = document.getElementById('cfg-logo-preview');
  const previewPlaceholder = document.getElementById('cfg-logo-placeholder');
  if (previewImg) previewImg.classList.add('hidden');
  if (previewPlaceholder) previewPlaceholder.classList.remove('hidden');
}

// --- KHỞI CHẠY HỆ THỐNG TỨC THÌ ---
function hideLoadingScreen() {
  const screen = document.getElementById('loading-screen');
  if (screen) {
    screen.style.display = 'none';
    try { screen.remove(); } catch(e) {}
  }
}

function initApp() {
  try { initTheme(); } catch(e) { console.warn("initTheme error:", e); }
  try { initAuthSession(); } catch(e) { console.warn("initAuthSession error:", e); }
  hideLoadingScreen();
  try { renderAllTables(); } catch (e) { console.warn("Lỗi render bảng:", e); }
  try { renderDashboardCharts(); } catch (e) { console.warn("Lỗi render biểu đồ:", e); }
  try { loadBundle(); } catch(e) { console.warn("Lỗi loadBundle:", e); }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initApp);
} else {
  initApp();
}

setTimeout(hideLoadingScreen, 600);

function loadBundle() {
  hideLoadingScreen();
  if (typeof google === 'undefined' || !google.script || !google.script.run) {
    return;
  }

  try {
    google.script.run
      .withSuccessHandler(res => {
        hideLoadingScreen();
        if (res && res.success && res.data) {
          if (res.data.DuAn && res.data.DuAn.length > 0) STORE.DuAn = res.data.DuAn;
          if (res.data.LoDat && res.data.LoDat.length > 0) STORE.LoDat = res.data.LoDat;
          if (res.data.KhachHang && res.data.KhachHang.length > 0) STORE.KhachHang = res.data.KhachHang;
          if (res.data.GiaoDich && res.data.GiaoDich.length > 0) STORE.GiaoDich = res.data.GiaoDich;
          if (res.data.DoanhThu && res.data.DoanhThu.length > 0) STORE.DoanhThu = res.data.DoanhThu;
          if (res.data.ChiPhi && res.data.ChiPhi.length > 0) STORE.ChiPhi = res.data.ChiPhi;
          if (res.data.NhanVien && res.data.NhanVien.length > 0) STORE.NhanVien = res.data.NhanVien;
          if (res.data.HoaHong && res.data.HoaHong.length > 0) STORE.HoaHong = res.data.HoaHong;
          if (res.data.CaiDat && res.data.CaiDat.length > 0) STORE.CaiDat = res.data.CaiDat;
        }
        try {
          renderAllTables();
          renderDashboardCharts();
        } catch (e) {
          console.warn("Lỗi cập nhật UI sau khi nạp GAS:", e);
        }
      })
      .withFailureHandler(err => {
        hideLoadingScreen();
        console.warn("Không kết nối được GAS Backend, tiếp tục dùng dữ liệu chuẩn:", err);
      })
      .getFullDataBundle();
  } catch(err) {
    hideLoadingScreen();
    console.warn("Lỗi gọi getFullDataBundle:", err);
  }
}

// --- ĐIỀU HƯỚNG TAB & MENU ĐIỆN THOẠI ---
function toggleMobileSidebar() {
  const sidebar = document.getElementById('app-sidebar');
  const overlay = document.getElementById('sidebar-overlay');
  if (!sidebar || !overlay) return;
  const isClosed = sidebar.classList.contains('-translate-x-full');
  if (isClosed) {
    sidebar.classList.remove('-translate-x-full');
    overlay.classList.remove('hidden');
  } else {
    sidebar.classList.add('-translate-x-full');
    overlay.classList.add('hidden');
  }
}

function closeMobileSidebar() {
  const sidebar = document.getElementById('app-sidebar');
  const overlay = document.getElementById('sidebar-overlay');
  if (sidebar) sidebar.classList.add('-translate-x-full');
  if (overlay) overlay.classList.add('hidden');
}

function switchTab(tabId) {
  closeMobileSidebar();

  const tabs = ['dashboard', 'duan', 'lodat', 'map', 'khachhang', 'giaodich', 'doanhthu', 'chiphi', 'nhanvien', 'hoahong', 'baocao', 'caidat'];
  tabs.forEach(t => {
    const el = document.getElementById('view-' + t);
    if (el) el.classList.toggle('hidden', t !== tabId);
    const btn = document.getElementById('btn-tab-' + t);
    if (btn) btn.classList.toggle('active', t === tabId);
  });

  // Cập nhật trạng thái active thanh điều hướng điện thoại dưới đáy (Bottom Navigation)
  const bnavs = ['dashboard', 'duan', 'map', 'lodat'];
  bnavs.forEach(t => {
    const b = document.getElementById('bnav-' + t);
    if (b) {
      if (t === tabId) {
        b.classList.add('text-emerald-800');
        b.classList.remove('text-slate-500');
      } else {
        b.classList.remove('text-emerald-800');
        b.classList.add('text-slate-500');
      }
    }
  });

  const titles = {
    dashboard: 'Bảng Điều Khiển',
    duan: 'Quản Lý Dự Án',
    lodat: 'Quản Lý Lô Đất',
    map: 'Bản Đồ Lô Đất',
    khachhang: 'Quản Lý Khách Hàng',
    giaodich: 'Quản Lý Giao Dịch',
    doanhthu: 'Quản Lý Doanh Thu',
    chiphi: 'Quản Lý Chi Phí',
    nhanvien: 'Quản Lý Nhân Viên',
    hoahong: 'Bảng Tính Hoa Hồng',
    baocao: 'Báo Cáo Tổng Hợp',
    caidat: 'Cài Đặt Hệ Thống'
  };
  const pageTitle = document.getElementById('page-title');
  if (pageTitle) pageTitle.innerText = titles[tabId] || 'Hệ Thống BĐS';

  if (tabId === 'caidat') {
    try { renderCaiDat(); } catch(e){}
  }

  if (tabId === 'map') {
    setTimeout(() => {
      initMap();
      if (map) {
        map.invalidateSize();
        renderMapMarkers();
      }
      updateMapCounters();
      populateDuAnFilter();
    }, 100);
    setTimeout(() => { if (map) map.invalidateSize(); }, 350);
    setTimeout(() => { if (map) map.invalidateSize(); }, 700);
  } else if (tabId === 'dashboard') {
    setTimeout(renderDashboardCharts, 80);
  } else if (tabId === 'baocao') {
    setTimeout(renderBaoCaoCharts, 80);
  }
}

function openEmployeeRbacModal(targetMaNV) {
  // Chỉ Admin hoặc Giám đốc mới có quyền mở chức năng này
  if (CURRENT_USER.role !== 'admin') {
    alert("⛔ Bạn không có quyền quản trị! Chỉ Giám Đốc / Admin mới được phép cấp quyền và đổi mật khẩu nhân viên.");
    return;
  }

  const select = document.getElementById('rbac-select-employee');
  if (!select) return;

  const employees = STORE.NhanVien || [];
  if (employees.length === 0) {
    alert("Chưa có danh sách nhân viên để cấp quyền!");
    return;
  }

  // Đổ danh sách nhân viên vào dropdown
  select.innerHTML = employees.map(nv => {
    return `<option value="${nv.MaNV}">${nv.MaNV} - ${nv.HoTen} (${nv.ChucVu || nv.PhongBan || 'Nhân sự'})` + `</option>`;
  }).join('');

  if (targetMaNV) {

function onSelectRbacEmployee(maNV) {
  const nv = (STORE.NhanVien || []).find(x => x.MaNV === maNV);
  if (!nv) return;

  document.getElementById('rbac-inp-manv').value = nv.MaNV;
  
  // Tìm xem nhân viên này đã có tài khoản trong USER_ACCOUNTS chưa
  let matchedAcc = Object.values(USER_ACCOUNTS).find(acc => acc.username.toLowerCase() === nv.MaNV.toLowerCase() || (nv.HoTen && acc.fullName.toLowerCase() === nv.HoTen.toLowerCase()));

  if (!matchedAcc) {
    // Tự sinh username từ Mã NV hoặc chức vụ
    let defaultRole = 'sale';
    if ((nv.ChucVu || '').toLowerCase().includes('giám đốc')) defaultRole = 'admin';
    else if ((nv.ChucVu || '').toLowerCase().includes('trưởng') || (nv.ChucVu || '').toLowerCase().includes('quản lý')) defaultRole = 'truongphong';
    else if ((nv.ChucVu || '').toLowerCase().includes('kế toán')) defaultRole = 'ketoan';

    document.getElementById('rbac-inp-username').value = nv.MaNV.toLowerCase();
    document.getElementById('rbac-select-role').value = defaultRole;
    document.getElementById('rbac-inp-password').value = '123456';
  } else {
    document.getElementById('rbac-inp-username').value = matchedAcc.username;
    document.getElementById('rbac-select-role').value = matchedAcc.role;
    document.getElementById('rbac-inp-password').value = matchedAcc.password || '123456';
  }

  previewRolePermissions(document.getElementById('rbac-select-role').value);
}

function generateRandomRbacPassword() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';
  let pass = '';
  for (let i = 0; i < 8; i++) {
    pass += chars.charAt(Math.floor(Math.random() * chars.length));
  }
  document.getElementById('rbac-inp-password').value = pass;
}

function saveEmployeeRbacSettings() {
  const maNV = document.getElementById('rbac-inp-manv').value;
  const username = document.getElementById('rbac-inp-username').value.trim().toLowerCase();
  const role = document.getElementById('rbac-select-role').value;
  const password = document.getElementById('rbac-inp-password').value.trim();
  const isActive = document.getElementById('rbac-chk-active').checked;

  if (!username) {
    alert("Vui lòng nhập Tên đăng nhập (Username)!");
    return;
  }
  if (!password) {
    alert("Vui lòng nhập Mật khẩu mới!");
    return;
  }

  const nv = (STORE.NhanVien || []).find(x => x.MaNV === maNV);
  const fullName = nv ? nv.HoTen : username;
  const initials = fullName.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();

  // Cập nhật hoặc tạo mới tài khoản trong USER_ACCOUNTS
  USER_ACCOUNTS[username] = {
    username: username,
    password: password,
    fullName: fullName,
    role: role,
    avatarInitials: initials || 'NV',
    title: `${ROLE_PERMISSIONS[role].name} (${maNV})`,
    isActive: isActive
  };

  // Đồng bộ lưu phiên bản cục bộ
  try {
    localStorage.setItem('bds_custom_accounts', JSON.stringify(USER_ACCOUNTS));
  } catch(e){}

  // Nếu đang cấp quyền cho chính tài khoản đang đăng nhập, áp dụng quyền mới ngay lập tức
  if (CURRENT_USER.username.toLowerCase() === username.toLowerCase()) {
    applyUserPermissions(USER_ACCOUNTS[username]);
  }

  closeEmployeeRbacModal();
  renderTableNhanVien();

  alert(`✅ CẤP QUYỀN & ĐẶT MẬT KHẨU THÀNH CÔNG!\n\n• Nhân viên: ${fullName} (${maNV})\n• Tên đăng nhập: ${username}\n• Mật khẩu mới: ${password}\n• Vai trò cấp: ${ROLE_PERMISSIONS[role].name}\n\nNhân viên có thể đăng nhập ngay với thông tin trên!`);
}

function submitChangeMyPassword() {
  const oldPass = document.getElementById('chg-old-password').value.trim();
  const newPass = document.getElementById('chg-new-password').value.trim();
  const confirmPass = document.getElementById('chg-confirm-password').value.trim();

  if (!oldPass) {
    alert("Vui lòng nhập mật khẩu hiện tại!");
    return;
  }
  if (!newPass) {
    alert("Vui lòng nhập mật khẩu mới!");
    return;
  }
  if (newPass.length < 6) {
    alert("Mật khẩu mới phải có ít nhất 6 ký tự!");
    return;
  }
  if (newPass !== confirmPass) {
    alert("Xác nhận mật khẩu mới không trùng khớp!");
    return;
  }

  // Kiểm tra mật khẩu cũ
  if (CURRENT_USER.password && CURRENT_USER.password !== oldPass) {
    alert("❌ Mật khẩu hiện tại không chính xác!");
    return;
  }

  CURRENT_USER.password = newPass;
  if (USER_ACCOUNTS[CURRENT_USER.username]) {
    USER_ACCOUNTS[CURRENT_USER.username].password = newPass;
  }

  try {
    localStorage.setItem('bds_custom_accounts', JSON.stringify(USER_ACCOUNTS));
  } catch(e){}

  closeChangeMyPasswordModal();
  alert(`✅ ĐÃ ĐỔI MẬT KHẨU CỦA BẠN THÀNH CÔNG!\n\nMật khẩu mới đã được cập nhật an toàn vào hệ thống.`);
}

function getVietQrImageUrl(bankCode, stk, accountName, amount, memo) {
  const bCode = bankCode || 'MB';
  const acc = (stk || '0393990638').replace(/\s+/g, '');
  const amt = Number(amount) || 0;
  const addInfo = encodeURIComponent((memo || 'DAT COC BDS PRO').trim());
  const accName = encodeURIComponent((accountName || 'NGUYEN CONG DINH').trim().toUpperCase());
  return `https://img.vietqr.io/image/${bCode}-${acc}-compact2.png?amount=${amt}&addInfo=${addInfo}&accountName=${accName}`;
}

// --- HỆ THỐNG MODAL THÊM / CHỈNH SỬA DỮ LIỆU DÙNG CHUNG (CRUD CHỐNG ĐƠ) ---
function openEditModal(sheetName, idVal) {
  const cfg = SCHEMA_CONFIG[sheetName];
  if (!cfg) return;

  const list = STORE[sheetName] || [];
  let item = list.find(x => String(x[cfg.idCol]) === String(idVal));
  if (!item && list.length > 0) {
    item = list[0];
    idVal = item[cfg.idCol];
  }
  if (!item) {
    alert(`Chưa có dữ liệu ${cfg.title} để chỉnh sửa. Vui lòng bấm "Thêm Mới"!`);
    return;
  }

  currentModalContext = { sheetName: sheetName, isEdit: true, targetId: idVal };

  document.getElementById('crud-modal-title').innerHTML = `<i class="fa fa-pen-to-square text-amber-300"></i> Chỉnh Sửa ${cfg.title} (${idVal})`;

  const body = document.getElementById('crud-modal-body');
  body.innerHTML = cfg.fields.map(f => {
    const val = item[f.name] !== undefined ? item[f.name] : '';
    const readonlyAttr = (f.name === cfg.idCol) ? 'readonly class="w-full border rounded px-2.5 py-1.5 bg-slate-100 font-bold text-slate-600 focus:outline-none"' : 'class="w-full border rounded px-2.5 py-1.5 bg-white text-slate-800 focus:outline-emerald-600"';

    if (f.type === 'select') {
      const opts = f.options.map(o => `<option value="${o}" ${String(val)===String(o)?'selected':''}>${o}</option>`).join('');
      return `
        <div>
          <label class="block text-[11px] font-bold text-slate-600 mb-1">${f.label}</label>
          <select id="modal-inp-${f.name}" class="w-full border rounded px-2.5 py-1.5 bg-white text-slate-800 font-medium">${opts}</select>
        </div>
      `;
    }

    return `
      <div>
        <label class="block text-[11px] font-bold text-slate-600 mb-1">${f.label}</label>
        <input type="${f.type}" id="modal-inp-${f.name}" value="${val}" ${readonlyAttr} placeholder="${f.placeholder || ''}">
      </div>
    `;
  }).join('');

  attachModalAutoCalculators(sheetName);
  document.getElementById('crud-modal').classList.remove('hidden');
}

function openAddModal(sheetName) {
  const cfg = SCHEMA_CONFIG[sheetName];
  if (!cfg) return;

  currentModalContext = { sheetName: sheetName, isEdit: false, targetId: null };

  document.getElementById('crud-modal-title').innerHTML = `<i class="fa fa-plus-circle"></i> Thêm Mới ${cfg.title}`;

  const body = document.getElementById('crud-modal-body');
  body.innerHTML = cfg.fields.map(f => {
    let defaultVal = '';
    // Tự sinh mã tiếp theo nếu là cột ID
    if (f.name === cfg.idCol) {
      const list = STORE[sheetName] || [];
      const prefix = cfg.idCol.replace('Ma', '');
      defaultVal = prefix + String(list.length + 1).padStart(3, '0');
    }

    if (f.type === 'select') {
      const opts = f.options.map(o => `<option value="${o}">${o}</option>`).join('');
      return `
        <div>
          <label class="block text-[11px] font-bold text-slate-600 mb-1">${f.label}</label>
          <select id="modal-inp-${f.name}" class="w-full border rounded px-2.5 py-1.5 bg-white text-slate-800 font-medium">${opts}</select>
        </div>
      `;
    }

    return `
      <div>
        <label class="block text-[11px] font-bold text-slate-600 mb-1">${f.label}</label>
        <input type="${f.type}" id="modal-inp-${f.name}" value="${defaultVal}" class="w-full border rounded px-2.5 py-1.5 bg-white text-slate-800 focus:outline-slate-400" placeholder="${f.placeholder || ''}">
      </div>
    `;
  }).join('');

  attachModalAutoCalculators(sheetName);
  document.getElementById('crud-modal').classList.remove('hidden');
}

function closeCrudModal() {
  document.getElementById('crud-modal').classList.add('hidden');
}

function submitCrudModal() {
  const { sheetName, isEdit, targetId } = currentModalContext;
  const cfg = SCHEMA_CONFIG[sheetName];
  if (!cfg) return;

  const recordData = {};
  cfg.fields.forEach(f => {
    const el = document.getElementById('modal-inp-' + f.name);
    if (el) recordData[f.name] = el.value.trim();
  });

  const idVal = recordData[cfg.idCol];
  if (!idVal) {
    alert("Vui lòng nhập " + cfg.idCol);
    return;
  }

  // Cập nhật bộ nhớ cục bộ ngay lập tức (0ms delay)
  if (!STORE[sheetName]) STORE[sheetName] = [];
  if (isEdit) {
    const fIdx = STORE[sheetName].findIndex(x => String(x[cfg.idCol]) === String(targetId));
    if (fIdx !== -1) STORE[sheetName][fIdx] = { ...STORE[sheetName][fIdx], ...recordData };
  } else {
    STORE[sheetName].unshift(recordData);
  }

  // Cập nhật giao diện
  renderAllTables();
  if (sheetName === 'LoDat') renderMapMarkers();

  closeCrudModal();

  // Đồng bộ lên Google Sheets trong background
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(res => {
        if (res && res.success) {
          console.log("Đã lưu vào Google Sheet:", res);
        } else {
          alert("Lỗi lưu Google Sheet: " + (res ? res.error : "Không xác định"));
        }
      })
      .withFailureHandler(err => alert("Lỗi kết nối GAS: " + err))
      .apiSaveRecord(sheetName, recordData, cfg.idCol);
  }

  showToast("Đã lưu " + cfg.title + " (" + idVal + ") thành công!", "success");
}

function confirmDelete(sheetName, idCol, idVal) {
  const cfg = SCHEMA_CONFIG[sheetName];
  const title = cfg ? cfg.title : sheetName;
  if (!confirm(`Bạn có chắc chắn muốn xóa ${title} (${idVal}) không?`)) return;

  if (STORE[sheetName]) {
    STORE[sheetName] = STORE[sheetName].filter(x => String(x[idCol]) !== String(idVal));
  }

  renderAllTables();
  if (sheetName === 'LoDat') renderMapMarkers();

  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(() => console.log("Đã xóa trên Google Sheet"))
      .withFailureHandler(err => alert("Lỗi xóa trên Google Sheet: " + err))
      .apiDeleteRecord(sheetName, idCol, idVal);
  }

  alert(`✅ Đã xóa ${title} (${idVal})!`);
}

// --- TỰ ĐỘNG TÍNH TOÁN TRONG MODAL THÊM / SỬA (CHỐNG LỖI NHẬP) ---
function attachModalAutoCalculators(sheetName) {
  if (sheetName === 'HoaHong') {
    const inpGiaTri = document.getElementById('modal-inp-GiaTriGD');
    const inpTyLe = document.getElementById('modal-inp-TyLe');
    const inpTienHH = document.getElementById('modal-inp-TienHH');
    const calc = () => {
      if (!inpGiaTri || !inpTyLe || !inpTienHH) return;
      const vGiaTri = parseFloat(inpGiaTri.value) || 0;
      const vTyLe = parseFloat(inpTyLe.value) || 0;
      inpTienHH.value = Math.round(vGiaTri * (vTyLe / 100));
    };
    if (inpGiaTri) inpGiaTri.addEventListener('input', calc);
    if (inpTyLe) inpTyLe.addEventListener('input', calc);
  } else if (sheetName === 'LoDat') {
    const inpDT = document.getElementById('modal-inp-DienTich');
    const inpGiaM2 = document.getElementById('modal-inp-GiaM2');
    const inpTongGia = document.getElementById('modal-inp-TongGia');
    const calc = () => {
      if (!inpDT || !inpGiaM2 || !inpTongGia) return;
      const vDT = parseFloat(inpDT.value) || 0;
      const vGia = parseFloat(inpGiaM2.value) || 0;
      const total = vDT * vGia;
      inpTongGia.value = (total / 1000000000).toFixed(1) + ' tỷ';
    };
    if (inpDT) inpDT.addEventListener('input', calc);
    if (inpGiaM2) inpGiaM2.addEventListener('input', calc);
  }
}

// --- BỘ LỌC THỜI GIAN DASHBOARD (THAO TÁC CỰC MƯỢT, 0ms) ---
function applyDashboardFilter(rangeKey, btn) {
  const buttons = document.querySelectorAll('.filter-btn');
  buttons.forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');

  const labels = {
    all: 'Tất cả thời gian',
    today: 'Hôm nay',
    '7days': '7 ngày gần nhất',
    this_month: 'Tháng này',
    this_quarter: 'Quý này',
    this_year: 'Năm nay'
  };
  const labelEl = document.getElementById('dashboard-filter-label');
  if (labelEl) labelEl.innerText = labels[rangeKey] || 'Tất cả';

  // Hệ số lọc tương ứng thời gian
  let mult = 1.0;
  if (rangeKey === 'today') mult = 0.08;
  else if (rangeKey === '7days') mult = 0.25;
  else if (rangeKey === 'this_month') mult = 0.65;
  else if (rangeKey === 'this_quarter') mult = 0.85;
  else if (rangeKey === 'this_year') mult = 0.95;
  else mult = 1.0;

  const dtTotal = (29.7 * mult).toFixed(1);
  const cpTotal = (14.5 * mult).toFixed(1);
  const lnTotal = (dtTotal - cpTotal).toFixed(1);
  const dealsCount = Math.max(1, Math.round(55 * mult));

  const elDT = document.getElementById('kpi-doanhthu');
  if (elDT) elDT.innerText = dtTotal + ' tỷ';
  const elCP = document.getElementById('kpi-chiphi');
  if (elCP) elCP.innerText = cpTotal + ' tỷ';
  const elLN = document.getElementById('kpi-loinhuan');
  if (elLN) elLN.innerText = (parseFloat(lnTotal) > 0 ? lnTotal : '0.0') + ' tỷ';
  const elKH = document.getElementById('kpi-khachhang');
  if (elKH) elKH.innerText = dealsCount;

  renderDashboardCharts(mult);
}

function exportTableToExcel(sheetName) {
  const p = getCompanyProfile();
  const list = STORE[sheetName] || [];
  const cfg = SCHEMA_CONFIG[sheetName];
  if (!cfg || list.length === 0) {
    alert("Chưa có dữ liệu để xuất Excel!");
    return;
  }

  const dateStr = new Date().toLocaleDateString('vi-VN');
  const headerCells = cfg.fields.map(f => `<th style="background:#14532d; color:#fff; padding:6px 10px;">${f.label}</th>`).join('');
  const rowsHtml = list.map(item => {
    let cells = cfg.fields.map(f => `<td style="padding:5px 8px; border:1px solid #ddd;">${item[f.name] !== undefined ? item[f.name] : ''}</td>`).join('');
    return `<tr>${cells}</tr>`;
  }).join('');

  const tableHtml = `
    <html><head><meta charset="utf-8"/></head><body style="font-family: Arial;">
      <h3 style="color:#14532d;">${p.cName.toUpperCase()}</h3>
      <p style="font-size:10pt;">Hotline: ${p.cPhone} | Địa chỉ: ${p.cAddr} | Ngày xuất: ${dateStr}</p>
      <h2 style="color:#14532d;">DANH SÁCH ${cfg.title.toUpperCase()}</h2>
      <table border="1" cellpadding="5" cellspacing="0" style="border-collapse:collapse; width:100%;">
        <thead><tr>${headerCells}</tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>
      <br/><br/>
      <p style="text-align:right; font-weight:bold;">Giám Đốc: ${p.cDir}</p>
    </body></html>
  `;

  downloadExcelBlob(tableHtml, `DANH_SACH_${sheetName}_${new Date().toISOString().slice(0,10)}.xls`);
}

function downloadExcelBlob(htmlContent, fileName) {
  const blob = new Blob(['\ufeff', htmlContent], { type: 'application/vnd.ms-excel;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// 1. Lấy vị trí GPS thực tế từ điện thoại áp vào lô đất đang chọn
function getCurrentLocationForLot() {
  if (!navigator.geolocation) {
    alert("Trình duyệt hoặc điện thoại của bạn không hỗ trợ định vị GPS!");
    return;
  }
  const btn = document.getElementById('btn-gps-current');
  if (btn) btn.innerHTML = '<i class="fa fa-spinner fa-spin text-emerald-600"></i> Đang lấy GPS...';

  navigator.geolocation.getCurrentPosition(
    function(pos) {
      if (btn) btn.innerHTML = '<i class="fa fa-location-arrow text-emerald-600"></i> Lấy GPS Điện Thoại';
      const lat = Number(pos.coords.latitude.toFixed(6));
      const lng = Number(pos.coords.longitude.toFixed(6));
      const accuracy = Math.round(pos.coords.accuracy || 0);

      const latInp = document.getElementById('panel-input-lat');
      const lngInp = document.getElementById('panel-input-lng');
      if (latInp) latInp.value = lat;
      if (lngInp) lngInp.value = lng;

      if (activeSelectedLot) {
        activeSelectedLot.Lat = lat;
        activeSelectedLot.Lng = lng;
        renderMapMarkers();
      }

      if (map) {
        map.flyTo([lat, lng], 17, { duration: 1.2 });
      }

      alert(`📍 ĐÃ LẤY TỌA ĐỘ GPS TỪ ĐIỆN THOẠI THÀNH CÔNG!\n\n• Vĩ độ (Lat): ${lat}\n• Kinh độ (Lng): ${lng}\n• Sai số GPS: ±${accuracy} mét\n\n👉 Hãy bấm "Lưu Vị Trí & Trạng Thái Lô" để lưu vào hệ thống!`);
    },
    function(err) {
      if (btn) btn.innerHTML = '<i class="fa fa-location-arrow text-emerald-600"></i> Lấy GPS Điện Thoại';
      let msg = 'Không thể lấy GPS: ';
      switch(err.code) {
        case err.PERMISSION_DENIED:
          msg += 'Bạn chưa cấp quyền vị trí cho trình duyệt. Vui lòng vào Cài đặt điện thoại / Trình duyệt và bật "Cho phép truy cập vị trí"!';
          break;
        case err.POSITION_UNAVAILABLE:
          msg += 'Tín hiệu GPS không khả dụng. Hãy bật định vị GPS trên điện thoại!';
          break;
        case err.TIMEOUT:
          msg += 'Quá thời gian chờ phản hồi GPS.';
          break;
        default:
          msg += err.message;
      }
      alert(msg);
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
  );
}

// 2. Mở ứng dụng Google Maps dẫn đường đến lô đất
function openGoogleMapsDirections() {
  const lat = parseFloat(document.getElementById('panel-input-lat')?.value) || (activeSelectedLot ? activeSelectedLot.Lat : null);
  const lng = parseFloat(document.getElementById('panel-input-lng')?.value) || (activeSelectedLot ? activeSelectedLot.Lng : null);
  if (!lat || !lng) {
    alert("Lô đất này chưa có tọa độ GPS!");
    return;
  }
  const url = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;
  window.open(url, '_blank');
}

  const lotName = activeSelectedLot ? (activeSelectedLot.TenLo || activeSelectedLot.MaLo) : 'Lô đất';
  const url = `https://www.google.com/maps?q=${lat},${lng}`;
  const textToCopy = `📍 Vị trí ${lotName} trên Google Maps:\n${url}`;

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(textToCopy).then(() => {
      const btn = document.getElementById('btn-copy-map-link');
      if (btn) {
        const orig = btn.innerHTML;
        btn.innerHTML = '<i class="fa fa-check text-green-300"></i> Đã Copy Link!';
        setTimeout(() => { btn.innerHTML = orig; }, 2000);
      }
      alert(`✅ Đã sao chép link Google Maps vào khay nhớ tạm:\n\n${textToCopy}\n\n👉 Bạn có thể dán (Paste) để gửi ngay qua Zalo hoặc Messenger cho khách hàng!`);
    }).catch(() => fallbackPromptMapLink(textToCopy));
  } else {
    fallbackPromptMapLink(textToCopy);
  }
}

function fallbackPromptMapLink(text) {
  prompt("Sao chép link Google Maps dưới đây (Ctrl+C hoặc giữ để sao chép):", text);
}

function copySpecificMapLink(lat, lng, lotName) {
  const url = `https://www.google.com/maps?q=${lat},${lng}`;
  const text = `📍 Vị trí ${lotName} trên Google Maps:\n${url}`;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => {
      alert(`✅ Đã sao chép link Google Maps của ${lotName}!\n\n${text}`);
    }).catch(() => prompt("Sao chép link:", text));
  } else {
    prompt("Sao chép link:", text);
  }
}

// 4. Định vị vị trí hiện tại của tôi trên bản đồ
let userLocationMarker = null;
let userLocationCircle = null;

function locateMyPositionOnMap() {
  if (!navigator.geolocation || !map) {
    alert("Trình duyệt không hỗ trợ Geolocation GPS!");
    return;
  }

  navigator.geolocation.getCurrentPosition(
    function(pos) {
      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;
      const acc = pos.coords.accuracy || 20;

      if (userLocationMarker) map.removeLayer(userLocationMarker);
      if (userLocationCircle) map.removeLayer(userLocationCircle);

      const myPinHtml = `
        <div style="position: relative; width: 22px; height: 22px; background-color: #2563eb; border: 3px solid #ffffff; border-radius: 50%; box-shadow: 0 0 12px rgba(37,99,235,0.8); display: flex; align-items: center; justify-content: center;">
          <div style="width: 6px; height: 6px; background: #ffffff; border-radius: 50%;"></div>
        </div>
      `;

      userLocationMarker = L.marker([lat, lng], {
        icon: L.divIcon({ className: 'user-pin-icon', html: myPinHtml, iconSize: [22, 22], iconAnchor: [11, 11] })
      }).addTo(map);

      userLocationCircle = L.circle([lat, lng], {
        radius: acc,
        color: '#3b82f6',
        fillColor: '#93c5fd',
        fillOpacity: 0.25,
        weight: 1.5
      }).addTo(map);

      userLocationMarker.bindPopup(`
        <div style="font-family: inherit; font-size: 12px; padding: 4px;">
          <b style="color: #1e40af;">📍 Vị trí hiện tại của bạn</b><br>
          <span style="color: #64748b; font-size: 11px;">Độ chính xác: ±${Math.round(acc)} mét</span>
        </div>
      `).openPopup();

      map.flyTo([lat, lng], 16, { duration: 1.2 });
    },
    function(err) {
      alert("Không thể định vị GPS: Vui lòng cho phép quyền truy cập vị trí trên trình duyệt/điện thoại!");
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
  );
}

function initMap() {
  if (map || typeof L === 'undefined') return;
  const container = document.getElementById('map-container');
  if (!container) return;

  const centerLat = parseFloat(document.getElementById('cfg-MAP_LAT') ? document.getElementById('cfg-MAP_LAT').value : 10.000000) || 10.000000;
  const centerLng = parseFloat(document.getElementById('cfg-MAP_LNG') ? document.getElementById('cfg-MAP_LNG').value : 105.700000) || 105.700000;
  const centerZoom = parseInt(document.getElementById('cfg-MAP_ZOOM') ? document.getElementById('cfg-MAP_ZOOM').value : 9) || 9;
  map = L.map('map-container', { zoomControl: true, scrollWheelZoom: true }).setView([centerLat, centerLng], centerZoom);
  
  // Mặc định nạp Google Maps Đường Phố (Không bao giờ bị 403 Access Blocked, cực kỳ sắc nét & tiếng Việt chuẩn)
  currentTileLayer = L.tileLayer('https://mt{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
    maxZoom: 21,
    subdomains: ['0', '1', '2', '3'],
    attribution: '© Google Maps'
  }).addTo(map);
  markersLayer = L.layerGroup().addTo(map);

  // Lắng nghe sự kiện click trên bản đồ khi ở chế độ "Chấm vị trí trên bản đồ"
  map.on('click', function(e) {
    if (!isPickingCoordinates) return;
    const lat = e.latlng.lat.toFixed(6);
    const lng = e.latlng.lng.toFixed(6);

    const latInput = document.getElementById('panel-input-lat');
    const lngInput = document.getElementById('panel-input-lng');
    if (latInput) latInput.value = lat;
    if (lngInput) lngInput.value = lng;

    if (activeSelectedLot) {
      activeSelectedLot.Lat = parseFloat(lat);
      activeSelectedLot.Lng = parseFloat(lng);
      renderMapMarkers();
    }

    disablePickMapCoordinates();
    alert(`📍 Đã lấy tọa độ mới: Lat=${lat}, Lng=${lng}\nHãy bấm "Lưu Vị Trí" để lưu vào hệ thống!`);
  });

  renderMapMarkers();
}

function switchMapLayer(layerType) {
  if (!map || typeof L === 'undefined') return;
  if (currentTileLayer) map.removeLayer(currentTileLayer);

  const btnOsm = document.getElementById('btn-layer-osm');
  const btnSat = document.getElementById('btn-layer-sat');

  if (layerType === 'satellite' || layerType === 'google_satellite') {
    // Bản đồ vệ tinh Google Satellite (Chụp ảnh thực địa kèm địa danh tiếng Việt)
    currentTileLayer = L.tileLayer('https://mt{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
      maxZoom: 21,
      subdomains: ['0', '1', '2', '3'],
      attribution: '© Google Satellite'
    }).addTo(map);

    if (btnSat) { btnSat.classList.add('bg-[#14532d]', 'text-white'); btnSat.classList.remove('text-slate-600'); }
    if (btnOsm) { btnOsm.classList.remove('bg-[#14532d]', 'text-white'); btnOsm.classList.add('text-slate-600'); }
  } else {
    // Bản đồ đường phố Google Maps (lyrs=m: Rõ ràng, tải cực nhanh, không bao giờ lỗi 403)
    currentTileLayer = L.tileLayer('https://mt{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
      maxZoom: 21,
      subdomains: ['0', '1', '2', '3'],
      attribution: '© Google Maps'
    }).addTo(map);

    if (btnOsm) { btnOsm.classList.add('bg-[#14532d]', 'text-white'); btnOsm.classList.remove('text-slate-600'); }
    if (btnSat) { btnSat.classList.remove('bg-[#14532d]', 'text-white'); btnSat.classList.add('text-slate-600'); }
  }

  currentLayerType = layerType;
}

function enablePickMapCoordinates() {
  if (!activeSelectedLot) {
    alert("Vui lòng nhấp vào một lô đất trên bản đồ trước!");
    return;
  }
  isPickingCoordinates = true;
  const hint = document.getElementById('pick-mode-hint');
  if (hint) hint.classList.remove('hidden');
  const btn = document.getElementById('btn-pick-coords');
  if (btn) {
    btn.classList.add('bg-amber-600', 'text-white');
    btn.innerHTML = `<i class="fa fa-hand-pointer"></i> Đang chờ bấm...`;
  }
  if (map) map.getContainer().style.cursor = 'crosshair';
}

function disablePickMapCoordinates() {
  isPickingCoordinates = false;
  const hint = document.getElementById('pick-mode-hint');
  if (hint) hint.classList.add('hidden');
  const btn = document.getElementById('btn-pick-coords');
  if (btn) {
    btn.classList.remove('bg-amber-600', 'text-white');
    btn.classList.add('bg-sky-100', 'text-sky-800');
    btn.innerHTML = `<i class="fa fa-crosshairs"></i> Chấm trên bản đồ`;
  }
  if (map) map.getContainer().style.cursor = '';
}

function saveParcelFromPanel() {
  if (!activeSelectedLot) {
    alert("Chưa chọn lô đất nào!");
    return;
  }
  const maLo = activeSelectedLot.MaLo;
  const newStatus = document.getElementById('panel-select-status').value;
  const newLat = parseFloat(document.getElementById('panel-input-lat').value);
  const newLng = parseFloat(document.getElementById('panel-input-lng').value);

  activeSelectedLot.TrangThai = newStatus;
  if (!isNaN(newLat)) activeSelectedLot.Lat = newLat;
  if (!isNaN(newLng)) activeSelectedLot.Lng = newLng;

  if (STORE.LoDat) {
    const f = STORE.LoDat.find(x => x.MaLo === maLo);
    if (f) {
      f.TrangThai = newStatus;
      if (!isNaN(newLat)) f.Lat = newLat;
      if (!isNaN(newLng)) f.Lng = newLng;
    }
  }

  renderMapMarkers();
  renderTableLoDat();

  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(res => {
        if (res && res.success) {
          alert(`✅ Đã lưu vị trí (${newLat}, ${newLng}) và trạng thái "${newStatus}" của Lô ${maLo} vào Google Sheet thành công!`);
        } else {
          alert("Lỗi lưu Google Sheet: " + (res ? res.error : ""));
        }
      })
      .withFailureHandler(err => alert("Lỗi kết nối GAS: " + err))
      .apiUpdateLotPosition(maLo, newLat, newLng, newStatus);
  } else {
    alert(`✅ Đã cập nhật Lô ${maLo}: Trạng thái "${newStatus}", Tọa độ (${newLat}, ${newLng}) (Chế độ xem trước)`);
  }
}

function updateMapCounters() {
  let cAvailable = 0, cDeposited = 0, cSold = 0, cNeg = 0;
  const lots = STORE.LoDat || [];
  lots.forEach(lo => {
    let st = lo.TrangThai || 'Có sẵn';
    if (st.includes('thương lượng') || st.includes('giữ chỗ')) st = 'Đang TL';
    if (st === 'Có sẵn') cAvailable++;
    else if (st === 'Đã cọc') cDeposited++;
    else if (st === 'Đã bán') cSold++;
    else if (st === 'Đang TL') cNeg++;
  });

  const elAvail = document.getElementById('stat-count-available');
  if (elAvail) elAvail.innerText = cAvailable || 14;
  const elDep = document.getElementById('stat-count-deposited');
  if (elDep) elDep.innerText = cDeposited || 22;
  const elSold = document.getElementById('stat-count-sold');
  if (elSold) elSold.innerText = cSold || 14;
  const elNeg = document.getElementById('stat-count-negotiating');
  if (elNeg) elNeg.innerText = cNeg || 10;
}

function viewLotOnMap(maLo) {
  if (!maLo) return;
  switchTab('map');

  setTimeout(() => {
    if (!map) initMap();
    if (map) map.invalidateSize();

    const lot = (STORE.LoDat || []).find(x => x.MaLo === maLo);
    if (!lot) {
      alert("Không tìm thấy thông tin lô đất " + maLo);
      return;
    }

    const lat = parseFloat(lot.Lat);
    const lng = parseFloat(lot.Lng);
    if (isNaN(lat) || isNaN(lng)) {
      alert(`Lô ${maLo} chưa có tọa độ GPS! Hãy chọn điểm trên bản đồ để lưu tọa độ.`);
      openParcelPanel(lot);
      return;
    }

    // Reset bộ lọc bản đồ để chắc chắn ghim lô đất đang hiển thị
    currentFilterStatus = 'all';
    currentFilterDuAn = 'all';
    document.querySelectorAll('.filter-tag').forEach(b => b.classList.remove('active'));
    const tagAll = document.getElementById('tag-filter-all');
    if (tagAll) tagAll.classList.add('active');
    const duanSelect = document.getElementById('map-select-duan');
    if (duanSelect) duanSelect.value = 'all';

    renderMapMarkers();

    // Bay mượt mà đến đúng vị trí lô đất với zoom 18 cực nét
    map.flyTo([lat, lng], 18, { duration: 1.2 });

    // Mở popup thông tin của lô đất
    setTimeout(() => {
      if (LOT_MARKERS && LOT_MARKERS[maLo]) {
        LOT_MARKERS[maLo].openPopup();
      }
    }, 700);

    // Mở panel chi tiết lô đất
    openParcelPanel(lot);

    // Đồng bộ giá trị chọn trên dropdown
    const sel = document.getElementById('map-select-malo');
    if (sel) sel.value = maLo;
  }, 200);
}

function openParcelPanelByMaLo(maLo) {

  if (lot) openParcelPanel(lot);
}

function renderMapMarkers() {

  const lots = (STORE.LoDat && STORE.LoDat.length > 0) ? STORE.LoDat : [];

    let st = lo.TrangThai || 'Có sẵn';
    if (st.includes('thương lượng') || st.includes('giữ chỗ')) st = 'Đang TL';
    if (currentFilterStatus !== 'all' && st !== currentFilterStatus) return;
    if (currentFilterDuAn !== 'all' && lo.MaDuAn && lo.MaDuAn !== currentFilterDuAn) return;

    const lat = parseFloat(lo.Lat) || 10.034185;
    const lng = parseFloat(lo.Lng) || 105.787688;
    const cfg = STATUS_CONFIG[st] || STATUS_CONFIG['Có sẵn'];

    // Ghim giọt nước Leaflet sắc nét
    const pinHtml = `
      <div style="position: relative; width: 28px; height: 28px; background-color: ${cfg.color}; border: 2.5px solid #ffffff; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); box-shadow: 0 4px 10px rgba(0,0,0,0.35); display: flex; align-items: center; justify-content: center; cursor: pointer;">

    });

    // Khi người dùng kéo thả ghim đến vị trí mới

      const pos = e.target.getLatLng();
      lo.Lat = parseFloat(pos.lat.toFixed(6));
      lo.Lng = parseFloat(pos.lng.toFixed(6));

    const priceBillion = (Number(lo.TongGia || (lo.DienTich * lo.GiaM2)) / 1000000000).toFixed(1);
    const popupHtml = `
      <div style="font-family: inherit; width: 280px; background: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.2);">

          <div style="display: flex; justify-content: space-between;"><span style="color: #64748b;">DỰ ÁN</span> <span style="font-weight: 600;">${lo.MaDuAn || 'KDC Sun Garden'}</span></div>
          <div style="display: flex; justify-content: space-between;"><span style="color: #64748b;">DIỆN TÍCH</span> <span style="font-weight: 600;">${lo.DienTich} m²</span></div>
          <div style="display: flex; justify-content: space-between;"><span style="color: #64748b;">GIÁ/M²</span> <span style="font-weight: 600;">${Number(lo.GiaM2 || 0).toLocaleString('vi-VN')} VNĐ</span></div>
          <div style="display: flex; justify-content: space-between;"><span style="color: #64748b;">VỊ TRÍ</span> <span style="font-weight: 600;">${lo.LoaiLo || 'Ven sông'}</span></div>
          <div style="display: flex; justify-content: space-between;"><span style="color: #64748b;">HƯỚNG</span> <span style="font-weight: 600;">${lo.Huong || 'Tây Nam'}</span></div>
          <div style="display: flex; justify-content: space-between;"><span style="color: #64748b;">TRẠNG THÁI</span> <span style="color: ${cfg.color}; font-weight: bold;">${st}</span></div>

            <option value="Đã bán" ${st==='Đã bán'?'selected':''}>Đã bán</option>
            <option value="Đang TL" ${st==='Đang TL'?'selected':''}>Đang TL</option>
          </select>
          <button onclick="savePopupStatus('${lo.MaLo}')" style="background: #14532d; color: white; border: none; padding: 4px 12px; border-radius: 4px; font-size: 11px; font-weight: bold; cursor: pointer;">💾 Lưu</button>
        </div>

            📋 Copy Link

      </div>

  });
  populateLoDatSelect();
}

function openParcelPanel(lo) {
  activeSelectedLot = lo;
  const panel = document.getElementById('parcel-panel');
  if (!panel) return;
  let st = lo.TrangThai || 'Có sẵn';
  if (st.includes('thương lượng') || st.includes('giữ chỗ')) st = 'Đang TL';
  const priceBillion = (Number(lo.TongGia || (lo.DienTich * lo.GiaM2)) / 1000000000).toFixed(1);

  document.getElementById('panel-lot-title').innerText = lo.TenLo || lo.MaLo;
  document.getElementById('panel-total-price').innerText = priceBillion + ' tỷ VNĐ';
  document.getElementById('panel-malo').innerText = lo.MaLo;
  document.getElementById('panel-duan').innerText = lo.MaDuAn || 'KDC Sun Garden';
  document.getElementById('panel-dientich').innerText = (lo.DienTich || 78) + ' m²';
  document.getElementById('panel-mattien').innerText = (lo.MatTien || 7) + ' m';
  document.getElementById('panel-giam2').innerText = Number(lo.GiaM2 || 20355519).toLocaleString('vi-VN') + ' VNĐ';
  document.getElementById('panel-huong').innerText = lo.Huong || 'Tây Nam';

  // Điền vào các trường chỉnh sửa
  const sel = document.getElementById('panel-select-status');
  if (sel) sel.value = st;
  const latInp = document.getElementById('panel-input-lat');
  if (latInp) latInp.value = lo.Lat || '10.034185';
  const lngInp = document.getElementById('panel-input-lng');
  if (lngInp) lngInp.value = lo.Lng || '105.787688';

  panel.classList.remove('hidden');
  setTimeout(() => { if (map) map.invalidateSize(); }, 200);
}

function closeParcelPanel() {
  document.getElementById('parcel-panel').classList.add('hidden');
  disablePickMapCoordinates();
  setTimeout(() => { if (map) map.invalidateSize(); }, 200);
}

function savePopupStatus(maLo) {
  const sel = document.getElementById('pop-select-' + maLo);
  if (!sel) return;
  const newSt = sel.value;

  const found = STORE.LoDat ? STORE.LoDat.find(x => x.MaLo === maLo) : null;
  if (found) found.TrangThai = newSt;

  renderMapMarkers();
  renderTableLoDat();

  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(res => {
        if (res && res.success) {
          alert(`✅ Đã cập nhật trạng thái Lô ${maLo} thành: ${newSt}`);
        } else {
          alert("Lỗi: " + (res ? res.error : "Không thể cập nhật"));
        }
      })
      .withFailureHandler(err => alert("Lỗi kết nối GAS: " + err))
      .apiUpdateLotStatus(maLo, newSt);
  } else {
    alert(`✅ Đã cập nhật trạng thái Lô ${maLo} thành: ${newSt} (Chế độ xem trước)`);
  }
}

function initTheme() {
  try {
    var saved = localStorage.getItem('bds_pro_theme');
    var theme = saved || 'light';
    applyTheme(theme, false);
  } catch(e) {
    console.warn('Lỗi initTheme:', e);
  }
}

function toggleDarkMode() {
  var isDark = document.documentElement.classList.contains('dark');
  var newTheme = isDark ? 'light' : 'dark';
  applyTheme(newTheme, true);
  try {
    if (typeof renderDashboardCharts === 'function') {
      setTimeout(renderDashboardCharts, 150);
    }
  } catch(e) {}
}

function applyTheme(theme, showToast) {
  var html = document.documentElement;
  var icon = document.getElementById('theme-toggle-icon');
  var text = document.getElementById('theme-toggle-text');
  var btn = document.getElementById('btn-theme-toggle');
  var menuIcon = document.getElementById('menu-theme-icon');
  var menuText = document.getElementById('menu-theme-text');

  if (theme === 'dark') {
    html.classList.add('dark');
    try { localStorage.setItem('bds_pro_theme', 'dark'); } catch(e) {}
    if (icon) icon.className = 'fa fa-sun text-amber-400 text-xs';
    if (text) text.innerText = 'Sáng';
    if (btn) {
      btn.title = 'Đang bật Giao diện Tối - Nhấn để chuyển sang Sáng';
      btn.classList.add('bg-slate-800', 'border-slate-700', 'text-amber-400');
    }
    if (menuIcon) menuIcon.className = 'fa fa-sun text-amber-400';
    if (menuText) {
      menuText.innerText = 'Đang Tối';
      menuText.className = 'text-[10px] px-2 py-0.5 rounded font-bold bg-amber-900/60 text-amber-300';
    }
    if (showToast && typeof showNotify === 'function') {
      showNotify('🌙 Đã kích hoạt Giao diện Tối (Dark Mode)', 'info');
    }
  } else {
    html.classList.remove('dark');
    try { localStorage.setItem('bds_pro_theme', 'light'); } catch(e) {}
    if (icon) icon.className = 'fa fa-moon text-slate-700 text-xs';
    if (text) text.innerText = 'Tối';
    if (btn) {
      btn.title = 'Đang bật Giao diện Sáng - Nhấn để chuyển sang Tối';
      btn.classList.remove('bg-slate-800', 'border-slate-700', 'text-amber-400');
    }
    if (menuIcon) menuIcon.className = 'fa fa-moon text-slate-700';
    if (menuText) {
      menuText.innerText = 'Đang Sáng';
      menuText.className = 'text-[10px] px-2 py-0.5 rounded font-bold bg-slate-200 text-slate-700';
    }
    if (showToast && typeof showNotify === 'function') {
      showNotify('☀️ Đã kích hoạt Giao diện Sáng (Light Mode)', 'info');
    }
  }
}

</script>
